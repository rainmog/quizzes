/* engine/css/tokens.css */
/* ==========================================================================
   Design tokens — sizes, type, motion. Colours live in themes.css.
   ========================================================================== */
:root {
  --font-display: "Fredoka", "Lexend", "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --font-body: "Lexend", "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --font-jp: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;

  /* Fluid type: readable on a phone, huge on a projector. --scale grows in big-screen mode. */
  --scale: 1;
  --fs-xs:   calc(var(--scale) * clamp(0.80rem, 0.70rem + 0.30vw, 0.95rem));
  --fs-sm:   calc(var(--scale) * clamp(0.95rem, 0.85rem + 0.35vw, 1.15rem));
  --fs-md:   calc(var(--scale) * clamp(1.10rem, 0.95rem + 0.60vw, 1.50rem));
  --fs-lg:   calc(var(--scale) * clamp(1.35rem, 1.05rem + 1.10vw, 2.20rem));
  --fs-xl:   calc(var(--scale) * clamp(1.70rem, 1.20rem + 2.00vw, 3.20rem));
  --fs-2xl:  calc(var(--scale) * clamp(2.20rem, 1.40rem + 3.20vw, 4.60rem));
  --fs-hero: calc(var(--scale) * clamp(3.00rem, 1.60rem + 6.00vw, 7.50rem));

  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-7: 3rem;

  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-pill: 999px;

  --topbar-h: 3.75rem;
  --content-w: 1200px;
  --tap-min: 48px;

  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  --dur-fast: 150ms;
  --dur-med: 300ms;
  --dur-slow: 550ms;
}

:root.big-screen { --scale: 1.3; --topbar-h: 4.5rem; }

@media (prefers-reduced-motion: reduce) {
  :root { --dur-fast: 1ms; --dur-med: 120ms; --dur-slow: 160ms; }
}

/* engine/css/themes.css */
/* ==========================================================================
   Colour themes. Set on <html data-theme="…">. Every theme must define the
   full token list below. Text-on-surface pairs must meet WCAG AA (4.5:1);
   option tiles carry large bold text, so 3:1 with white is the floor.
   Add a theme: copy a block, change values, add its name to THEMES in core.js
   and to the validator (build/validate.js).
   ========================================================================== */
:root,
[data-theme="ocean"] {
  --bg-a: #0c4a8f;
  --bg-b: #0f9bbd;
  --on-bg: #ffffff;
  --on-bg-muted: rgba(255, 255, 255, 0.78);
  --surface: #ffffff;
  --surface-2: #edf4fb;
  --surface-3: #dce9f6;
  --border: #c9dbee;
  --text: #0e1c30;
  --text-muted: #4a5b72;
  --primary: #1458c4;
  --primary-ink: #ffffff;
  --accent: #ffb703;
  --accent-ink: #2b1d00;
  --good: #12804a;
  --good-soft: #d3f5e1;
  --good-ink: #ffffff;
  --bad: #cc2e2a;
  --bad-soft: #fde0de;
  --bad-ink: #ffffff;
  --opt-1: #d61f48;
  --opt-2: #1663c7;
  --opt-3: #b07500;
  --opt-4: #22800e;
  --opt-5: #7a3ec2;
  --opt-6: #0b7f86;
  --opt-ink: #ffffff;
  --shadow-color: 215 60% 15%;
  --focus: #ffb703;
  --glass: rgba(255, 255, 255, 0.16);
  --glass-border: rgba(255, 255, 255, 0.28);
}

[data-theme="sunset"] {
  --bg-a: #ff7b54;
  --bg-b: #b8336a;
  --on-bg: #ffffff;

/* engine/css/base.css */
/* ==========================================================================
   Base: reset, page background, app shell (topbar + stage).
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh;
  min-height: 100dvh;
  font-family: var(--font-body);
  font-size: var(--fs-md);
  line-height: 1.45;
  color: var(--on-bg);
  background: linear-gradient(135deg, var(--bg-a), var(--bg-b)) fixed;
  background-color: var(--bg-a);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
:lang(ja), .jp { font-family: var(--font-jp); }
img, svg { display: block; max-width: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

:focus-visible {
  outline: 4px solid var(--focus);
  outline-offset: 3px;
  border-radius: var(--radius-sm);
}

/* Soft floating blobs behind everything — decoration only */
.bg-deco { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bg-deco span {
  position: absolute; border-radius: 50%;
  background: var(--on-bg); opacity: 0.07; filter: blur(2px);
  animation: blob-float 22s ease-in-out infinite alternate;
}
.bg-deco span:nth-child(1) { width: 38vmax; height: 38vmax; left: -12vmax; top: -14vmax; }
.bg-deco span:nth-child(2) { width: 26vmax; height: 26vmax; right: -8vmax; top: 30vh; animation-duration: 28s; }
.bg-deco span:nth-child(3) { width: 18vmax; height: 18vmax; left: 30vw; bottom: -10vmax; animation-duration: 34s; }

/* ---------- App shell ---------- */
.app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3);
  min-height: 3.75rem;
  padding: var(--space-2) clamp(var(--space-3), 2vw, var(--space-6));
  background: var(--glass);
  border-bottom: 1px solid var(--glass-border);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.tb-title { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
.tb-title strong {
  font-family: var(--font-display); font-weight: 600; font-size: var(--fs-md);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tb-title small { font-size: var(--fs-xs); color: var(--on-bg-muted); white-space: nowrap; }
.tb-stats { display: flex; align-items: center; gap: var(--space-3); }
.tb-tools { display: flex; align-items: center; gap: var(--space-1); }

.progress {
  position: absolute; left: 0; right: 0; bottom: -1px;
  height: 5px; background: transparent;
}
.progress > i {
  display: block; height: 100%; width: 0;
  background: var(--accent);
  border-radius: 0 var(--radius-pill) var(--radius-pill) 0;
  transition: width var(--dur-slow) var(--ease-out);
}

.stage {
  position: relative;
  flex: 1 1 auto;
  width: 100%;
  max-width: var(--content-w);
  margin: 0 auto;
  padding: clamp(var(--space-3), 3vw, var(--space-6));
  display: flex; flex-direction: column;
}
.screen { flex: 1 1 auto; display: flex; flex-direction: column; width: 100%; }

@media (max-width: 640px) {
  .tb-title small { display: none; }
  .tb-tools .hide-sm { display: none; }
  .tb-stats { order: 3; width: 100%; justify-content: center; }
  .tb-stats:empty { display: none; }
}

/* engine/css/components.css */
/* ==========================================================================
   Shared components: buttons, cards, chips, stat pills, intro + results
   screens, theme menu, timer ring, toasts.
   ========================================================================== */

/* ---------- Buttons ---------- */
.btn {
  --btn-bg: var(--primary);
  --btn-ink: var(--primary-ink);
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: var(--tap-min);
  padding: 0.6em 1.4em;
  border: 0; border-radius: var(--radius-pill);
  background: var(--btn-bg); color: var(--btn-ink);
  font-family: var(--font-display); font-weight: 600; font-size: var(--fs-md);
  letter-spacing: 0.01em;
  box-shadow: 0 4px 0 hsl(var(--shadow-color) / 0.35), 0 8px 18px hsl(var(--shadow-color) / 0.2);
  transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast), filter var(--dur-fast);
  user-select: none;
}
.btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 hsl(var(--shadow-color) / 0.35); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn svg { width: 1.2em; height: 1.2em; }
.btn-lg { font-size: var(--fs-lg); padding: 0.65em 1.8em; }
.btn-accent { --btn-bg: var(--accent); --btn-ink: var(--accent-ink); }
.btn-good { --btn-bg: var(--good); --btn-ink: var(--good-ink); }
.btn-bad { --btn-bg: var(--bad); --btn-ink: var(--bad-ink); }
.btn-ghost {
  --btn-bg: var(--surface-2); --btn-ink: var(--text);
  box-shadow: 0 3px 0 hsl(var(--shadow-color) / 0.18);
}

.icon-btn {
  display: inline-grid; place-items: center;
  width: 2.75rem; height: 2.75rem;
  border: 1px solid var(--glass-border); border-radius: var(--radius-pill);
  background: var(--glass); color: var(--on-bg);
  transition: background var(--dur-fast), transform var(--dur-fast);
  text-decoration: none;
}
.icon-btn:hover { background: color-mix(in srgb, var(--on-bg) 18%, transparent); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn svg { width: 1.3rem; height: 1.3rem; }
.icon-btn[aria-pressed="true"] { background: var(--on-bg); color: var(--bg-a); }
:root.big-screen .icon-btn { width: 3.25rem; height: 3.25rem; }

/* ---------- Cards ---------- */
.card {
  background: var(--surface); color: var(--text);
  border-radius: var(--radius-lg);
  box-shadow: 0 2px 0 hsl(var(--shadow-color) / 0.08), 0 18px 40px -12px hsl(var(--shadow-color) / 0.45);
}

/* ---------- Stat pills (topbar) ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 0.4em;
  padding: 0.3em 0.85em;
  border-radius: var(--radius-pill);
  background: var(--surface); color: var(--text);
  font-family: var(--font-display); font-weight: 600; font-size: var(--fs-sm);
  font-variant-numeric: tabular-nums;
  box-shadow: 0 3px 10px hsl(var(--shadow-color) / 0.25);
  white-space: nowrap;
}
.pill svg { width: 1.1em; height: 1.1em; flex: none; }
.pill-streak { background: var(--accent); color: var(--accent-ink); }
.pill-streak[data-level="0"] { display: none; }

/* ---------- Timer ring ---------- */
.timer-ring { position: relative; width: 3.2rem; height: 3.2rem; flex: none; }
:root.big-screen .timer-ring { width: 4rem; height: 4rem; }
.timer-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-ring circle { fill: none; stroke-width: 6; }
.timer-ring .track { stroke: var(--glass-border); }
.timer-ring .bar {
  stroke: var(--surface); stroke-linecap: round;
  transition: stroke-dashoffset 0.25s linear, stroke var(--dur-med);
}
.timer-ring.warn .bar { stroke: var(--accent); }
.timer-ring.danger .bar { stroke: var(--bad); }
.timer-ring span {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: var(--fs-sm);
  font-variant-numeric: tabular-nums;
}

/* ---------- Intro screen ---------- */
.intro { margin: auto; width: min(100%, 720px); padding: clamp(var(--space-5), 5vw, var(--space-7)); text-align: center; }
.intro .game-badge {
  display: inline-flex; align-items: center; gap: 0.5em;
  padding: 0.35em 1em; margin-bottom: var(--space-4);
  border-radius: var(--radius-pill);
  background: var(--surface-2); color: var(--primary);
  font-family: var(--font-display); font-weight: 600; font-size: var(--fs-sm);
}
.intro h1 {
  margin: 0 0 var(--space-2);
  font-family: var(--font-display); font-weight: 700; font-size: var(--fs-2xl);
  line-height: 1.05; color: var(--text);
}
.intro .meta { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-2); margin: var(--space-4) 0; }
.intro .meta span {
  padding: 0.2em 0.8em; border-radius: var(--radius-pill);
  background: var(--surface-2); color: var(--text-muted); font-size: var(--fs-sm);
}
.intro .howto { margin: var(--space-4) auto var(--space-6); max-width: 34em; color: var(--text-muted); font-size: var(--fs-md); }
.intro .howto .jp { display: block; margin-top: var(--space-1); font-size: var(--fs-sm); opacity: 0.85; }
.intro .keys { margin-top: var(--space-5); font-size: var(--fs-xs); color: var(--text-muted); }
kbd {
  display: inline-block; min-width: 1.7em; padding: 0.05em 0.45em;
  border: 1px solid var(--border); border-bottom-width: 3px; border-radius: 6px;
  background: var(--surface-2); color: var(--text);
  font-family: var(--font-body); font-size: 0.9em; text-align: center;
}

/* ---------- Results screen ---------- */
.results { margin: auto; width: min(100%, 760px); padding: clamp(var(--space-5), 4vw, var(--space-7)); text-align: center; }
.results h2 { margin: 0; font-family: var(--font-display); font-size: var(--fs-xl); color: var(--text); }
.results .stars { display: flex; justify-content: center; gap: var(--space-2); margin: var(--space-4) 0; }
.results .stars svg { width: clamp(2.6rem, 6vw, 4.2rem); height: auto; fill: var(--surface-3); stroke: var(--surface-3); }
.results .stars svg.on { fill: var(--accent); stroke: color-mix(in srgb, var(--accent) 70%, #000); }
.results .big-score {
  font-family: var(--font-display); font-weight: 700; font-size: var(--fs-hero);
  line-height: 1; color: var(--primary); font-variant-numeric: tabular-nums;
}
.results .big-score small { display: block; font-size: var(--fs-sm); font-weight: 500; color: var(--text-muted); margin-top: var(--space-2); }
.results .stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: var(--space-3);
  margin: var(--space-5) 0;
}
.results .stat { padding: var(--space-3); border-radius: var(--radius-md); background: var(--surface-2); }
.results .stat b { display: block; font-family: var(--font-display); font-size: var(--fs-xl); color: var(--text); font-variant-numeric: tabular-nums; }
.results .stat span { font-size: var(--fs-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
.results .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-3); margin-top: var(--space-5); }
.review { margin-top: var(--space-5); text-align: left; }
.review summary {
  cursor: pointer; font-family: var(--font-display); font-weight: 600; color: var(--text);
  padding: var(--space-2) 0;
}
.review ul { list-style: none; margin: var(--space-2) 0 0; padding: 0; display: grid; gap: var(--space-2); }
.review li {
  display: grid; grid-template-columns: auto 1fr; gap: var(--space-1) var(--space-3); align-items: start;
  padding: var(--space-3); border-radius: var(--radius-md);
  background: var(--bad-soft); color: var(--text); font-size: var(--fs-sm);
}
.review li.ok { background: var(--good-soft); }
.review li svg { width: 1.3em; height: 1.3em; color: var(--bad); grid-row: span 2; margin-top: 0.1em; }
.review li.ok svg { color: var(--good); }
.review li b { font-weight: 600; }
.review li small { color: var(--text-muted); }

/* ---------- Theme menu ---------- */
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 40;
  min-width: 13rem; padding: var(--space-2);
  background: var(--surface); color: var(--text);
  border-radius: var(--radius-md);
  box-shadow: 0 18px 40px -10px hsl(var(--shadow-color) / 0.5);
}
.menu button {
  display: flex; align-items: center; gap: var(--space-3); width: 100%;
  padding: var(--space-2) var(--space-3); border: 0; border-radius: var(--radius-sm);
  background: transparent; text-align: left; font-size: var(--fs-sm);
}
.menu button:hover, .menu button[aria-checked="true"] { background: var(--surface-2); }
.menu .swatch {
  width: 1.6rem; height: 1.6rem; border-radius: 50%; flex: none;
  border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border);
}

/* ---------- Toast / floating feedback ---------- */
.toast {
  position: fixed; left: 50%; bottom: var(--space-6); z-index: 50;
  transform: translateX(-50%);
  padding: var(--space-3) var(--space-5);
  border-radius: var(--radius-pill);
  background: var(--surface); color: var(--text);
  font-family: var(--font-display); font-weight: 600; font-size: var(--fs-md);
  box-shadow: 0 12px 30px hsl(var(--shadow-color) / 0.4);
  pointer-events: none;
}
.points-pop {
  position: fixed; z-index: 60; pointer-events: none;
  font-family: var(--font-display); font-weight: 700; font-size: var(--fs-xl);
  color: var(--accent); -webkit-text-stroke: 1.5px hsl(var(--shadow-color) / 0.6);
  text-shadow: 0 4px 12px hsl(var(--shadow-color) / 0.5);
}

.confetti-canvas { position: fixed; inset: 0; z-index: 70; pointer-events: none; width: 100vw; height: 100vh; }

/* ---------- Generic helpers ---------- */
.emoji { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; line-height: 1; }
.media-img { max-height: 30vh; width: auto; border-radius: var(--radius-md); object-fit: contain; margin: 0 auto; }
.say-btn {
  display: inline-grid; place-items: center; width: 2.6rem; height: 2.6rem;
  border: 0; border-radius: 50%; background: var(--surface-2); color: var(--primary);
  vertical-align: middle;
}
.say-btn svg { width: 1.3rem; height: 1.3rem; }
.say-btn:hover { background: var(--surface-3); }
mark.blank {
  display: inline-block; min-width: 4.5em; padding: 0 0.3em; margin: 0 0.15em;
  border-bottom: 0.12em solid currentColor; background: transparent; color: inherit;
  text-align: center;
}

/* ---------- Drag & drop states (engine/js/dnd.js) ---------- */
.dnd-ghost {
  position: fixed !important; left: 0; top: 0; z-index: 80; margin: 0 !important;
  pointer-events: none;
  box-shadow: 0 22px 40px -8px hsl(var(--shadow-color) / 0.55) !important;
  will-change: transform;
}
.dragging { opacity: 0.35; }
.selected {
  outline: 4px solid var(--accent) !important; outline-offset: 3px;
  transform: translateY(-3px) scale(1.03);
}
.has-selection [role="button"]:not(.locked):not(.selected) { cursor: copy; }
.drop-hover {
  outline: 3px dashed var(--primary) !important; outline-offset: 3px;
  background: var(--surface-3) !important;
}

/* engine/css/animations.css */
/* ==========================================================================
   Keyframes + utility animation classes. JS adds/removes .anim-* classes.
   Reduced motion: movement is replaced with short fades (bottom of file).
   ========================================================================== */
@keyframes blob-float {
  from { transform: translate(0, 0) scale(1); }
  to   { transform: translate(4vw, 3vh) scale(1.08); }
}
@keyframes pop-in {
  0%   { opacity: 0; transform: scale(0.85) translateY(12px); }
  100% { opacity: 1; transform: none; }
}
@keyframes bounce {
  0%, 100% { transform: scale(1); }
  30% { transform: scale(1.08); }
  55% { transform: scale(0.97); }
  75% { transform: scale(1.02); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-10px); }
  40% { transform: translateX(9px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(4px); }
}
@keyframes slide-in-right { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: none; } }
@keyframes slide-out-left { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(-60px); } }
@keyframes slide-in-up { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes float-up {
  0%   { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
  20%  { opacity: 1; transform: translate(-50%, -18px) scale(1.1); }
  100% { opacity: 0; transform: translate(-50%, -90px) scale(1); }
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); }
  50%      { box-shadow: 0 0 0 14px transparent; }
}
@keyframes streak-pop {
  0% { transform: scale(1); } 40% { transform: scale(1.35) rotate(-6deg); } 100% { transform: scale(1); }
}
@keyframes stagger-in { from { opacity: 0; transform: translateY(18px) scale(0.96); } to { opacity: 1; transform: none; } }

.anim-pop     { animation: pop-in var(--dur-slow) var(--ease-bounce) backwards; }
.anim-bounce  { animation: bounce 0.6s var(--ease-out); }
.anim-shake   { animation: shake 0.45s ease-in-out; }
.anim-in      { animation: slide-in-right var(--dur-slow) var(--ease-out) backwards; }
.anim-out     { animation: slide-out-left var(--dur-med) ease-in both; }
.anim-up      { animation: slide-in-up var(--dur-slow) var(--ease-out) backwards; }
.anim-fade    { animation: fade-in var(--dur-med) ease backwards; }
.anim-glow    { animation: pulse-glow 1s ease-out 2; }
.anim-streak  { animation: streak-pop 0.5s var(--ease-bounce); }
.points-pop   { animation: float-up 1.1s var(--ease-out) forwards; }
.stagger > *  { animation: stagger-in var(--dur-slow) var(--ease-out) backwards; }
.stagger > *:nth-child(1) { animation-delay: 30ms; }
.stagger > *:nth-child(2) { animation-delay: 90ms; }
.stagger > *:nth-child(3) { animation-delay: 150ms; }
.stagger > *:nth-child(4) { animation-delay: 210ms; }

/* templates/match/game.css */
/* ==========================================================================
   Template: match
   Wide: chip bank on the left, target rows on the right.
   Narrow: bank wraps on top, rows below.
   ========================================================================== */
.match {
  display: grid;
  grid-template-columns: minmax(12rem, 0.8fr) minmax(0, 2fr);
  gap: clamp(var(--space-3), 2.5vw, var(--space-6));
  align-items: start;
}
@media (max-width: 760px) { .match { grid-template-columns: 1fr; } }

.match-bank {
  display: flex; flex-direction: column; gap: var(--space-3);
  position: sticky; top: calc(var(--topbar-h) + var(--space-4));
}
@media (max-width: 760px) {
  .match-bank {
    flex-direction: row; flex-wrap: wrap; justify-content: center;
    position: sticky; top: calc(var(--topbar-h) + 6px); z-index: 5;
    padding: var(--space-2); margin: 0 calc(-1 * var(--space-2));
    border-radius: var(--radius-md);
    background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
}
.match-bank:not(:has(.match-chip))::after {
  content: "✓"; display: grid; place-items: center; height: 4rem;
  font-size: var(--fs-xl); color: var(--on-bg-muted);
}

.match-chip {
  display: flex; align-items: center; justify-content: center;
  min-height: var(--tap-min);
  padding: 0.55em 1.1em;
  border-radius: var(--radius-md);
  background: var(--primary); color: var(--primary-ink);
  font-family: var(--font-display); font-weight: 600; font-size: var(--fs-lg);
  text-align: center; line-height: 1.15;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--primary) 60%, #000), 0 10px 20px -8px hsl(var(--shadow-color) / 0.5);
  cursor: grab;
  touch-action: none;
  user-select: none; -webkit-user-select: none;
  transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast);
}
.match-chip:hover:not(.locked) { transform: translateY(-2px); }
.match-chip .fs { display: inline-flex; align-items: center; gap: 0.4em; }
.match-chip .fs-emoji { font-size: 1.3em; }
.match-chip.dnd-ghost { cursor: grabbing; }

.match-rows { display: grid; gap: var(--space-3); }
.match.visual .match-rows { grid-template-columns: repeat(auto-fill, minmax(min(100%, 12rem), 1fr)); }

.match-row {
  display: grid; grid-template-columns: minmax(8rem, 0.9fr) 2fr; align-items: stretch; gap: var(--space-3);
  min-height: 4.2rem;
  padding: var(--space-2);
  border-radius: var(--radius-md);
  background: var(--surface); color: var(--text);
  box-shadow: 0 8px 20px -10px hsl(var(--shadow-color) / 0.45);
  transition: background var(--dur-med), box-shadow var(--dur-med);
  cursor: pointer;
}
.match.visual .match-row { grid-template-columns: 1fr; grid-template-rows: auto auto; text-align: center; }
.match.visual .match-row .match-slot { order: 2; }
@media (max-width: 520px) { .match-row { grid-template-columns: 1fr; } .match-row .match-slot { order: 2; } }

.match-slot {
  display: flex; align-items: center; justify-content: center;
  min-height: 3.2rem;
  border: 3px dashed var(--border); border-radius: var(--radius-sm);
  background: var(--surface-2);
}
.match-slot .match-chip { width: 100%; box-shadow: none; cursor: default; font-size: var(--fs-md); }
.match-target {
  display: flex; align-items: center;
  padding: var(--space-2) var(--space-3);
  font-size: var(--fs-md); line-height: 1.3;
}
.match.visual .match-target { justify-content: center; }
.match-target .fs { display: flex; flex-direction: column; gap: var(--space-1); }
.match-target .fs-emoji { font-size: clamp(3rem, 7vw, 5rem); }
.match-target .fs-image { max-height: 9rem; }
.match-target .fs-example { color: var(--text-muted); font-size: var(--fs-sm); }

.match-row.done { background: var(--good-soft); cursor: default; }
.match-row.done .match-slot { border-color: transparent; background: transparent; }
.match-row.done .match-chip { background: var(--good); color: var(--good-ink); }
.match-row.wrong-flash { background: var(--bad-soft); }
.has-selection .match-row:not(.done) { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 70%, transparent), 0 8px 20px -10px hsl(var(--shadow-color) / 0.45); }
.match-gap { flex: none; }
@media (max-width: 760px) { .match-gap { display: none; } }

      el('button', { class: 'btn btn-lg btn-accent', type: 'button', autofocus: true, onclick: begin }, QG.icon('play'), 'Start'),
      meta.keys && el('p', { class: 'keys' }, meta.keys.map((k, i) => [i ? ' · ' : '', el('kbd', null, k[0]), ' ', k[1]]),
        ' · ', el('kbd', null, 'M'), ' sound · ', el('kbd', null, 'F'), ' fullscreen')
    );
    QG.clear(UI.stage).appendChild(el('div', { class: 'screen' }, card));
    QG.focusFirst(card);
  };
})(window.QG);

/* templates/match/game.js */
/* ==========================================================================
   Template: match — drag chips (settings.show) onto target cards
   (settings.target). Rounds of settings.pairs.
   ========================================================================== */
(function (QG) {
  'use strict';
  const el = QG.el;
  const T = QG.text;

  let state = null;

  function start(ctx) {
    const s = ctx.settings;
    let items = ctx.items.filter((it) => T.has(it, s.target) && T.has(it, s.show));
    if (s.shuffle) items = QG.shuffle(items);
    let rounds = QG.chunk(items, s.pairs);
    if (s.rounds) rounds = rounds.slice(0, s.rounds);
    const total = rounds.reduce((a, r) => a + r.length, 0);

    const roundPill = el('span', { class: 'pill', 'aria-label': 'Round' }, '');
    const mistakesLabel = el('span', null, '0');
    const mistakesPill = el('span', { class: 'pill', 'aria-label': 'Mistakes' }, QG.icon('x'), mistakesLabel);
    ctx.stats.append(roundPill, mistakesPill);
    const watch = new QG.Stopwatch({ mount: ctx.stats });

    state = { ctx, s, rounds, r: 0, total, matched: 0, mistakes: 0, missedIds: new Set(), roundPill, mistakesLabel, watch, dnd: null };
    watch.start();
    showRound(true);
  }

  function showRound(first) {
    const st = state;
    const round = st.rounds[st.r];
    st.roundLeft = round.length;
    st.roundPill.textContent = 'Round ' + (st.r + 1) + '/' + st.rounds.length;
    st.roundPill.hidden = st.rounds.length < 2;

    const chips = QG.shuffle(round).map((it) =>
      el('div', { class: 'match-chip', 'data-id': it._id, 'aria-label': T.plain(it, st.s.show) }, T.render(it, st.s.show))
    );
    const rows = QG.shuffle(round).map((it) =>
      el('div', { class: 'match-row', 'data-id': it._id, 'aria-label': 'Drop on: ' + T.plain(it, st.s.target) },
        el('div', { class: 'match-slot', 'aria-hidden': 'true' }),
        el('div', { class: 'match-target' }, T.render(it, st.s.target))
      )
    );
    const visualTarget = /^(emoji|image)$/.test(st.s.target);
    const board = el('div', { class: 'screen match' + (visualTarget ? ' visual' : '') },
      el('div', { class: 'match-bank stagger', 'aria-label': 'Words' }, chips),
      el('div', { class: 'match-rows stagger', 'aria-label': 'Targets' }, rows)
    );
    st.board = board;
    if (st.dnd) st.dnd.destroy();
    st.dnd = QG.dnd({ root: board, draggable: '.match-chip', target: '.match-row', onDrop });
    if (first) QG.clear(st.ctx.stage).appendChild(board);
    else { QG.sound.play('whoosh'); QG.swap(st.ctx.stage, board); }
  }

  function onDrop(chip, row) {
    const st = state;
    if (chip.dataset.id === row.dataset.id) {
      QG.sound.play('correct');
      const slot = row.querySelector('.match-slot');
      flipInto(chip, slot);
      chip.classList.add('locked');
      chip.setAttribute('tabindex', '-1');
      row.classList.add('locked', 'done');
      row.setAttribute('tabindex', '-1');
      QG.animate(row, 'anim-bounce');
      st.matched++;
      st.roundLeft--;
      QG.ui.progress(st.matched / st.total);
      if (st.roundLeft === 0) setTimeout(nextRound, 700);
      else {
        const nextChip = st.board.querySelector('.match-chip:not(.locked)');
        if (nextChip && document.activeElement === chip) nextChip.focus({ preventScroll: true });
      }
    } else {
      QG.sound.play('wrong');
      st.mistakes++;
      st.missedIds.add(chip.dataset.id);
      st.mistakesLabel.textContent = st.mistakes;
      QG.animate(chip, 'anim-shake');
      QG.animate(row, 'anim-shake');
      row.classList.add('wrong-flash');
      setTimeout(() => row.classList.remove('wrong-flash'), 450);
    }
  }

  // FLIP: move node into newParent and animate from its old position.
  function flipInto(node, newParent) {
    const first = node.getBoundingClientRect();
    // Leave a same-size gap in the bank so other chips don't jump (wide layout only, see CSS).
    node.before(el('div', { class: 'match-gap', style: { height: first.height + 'px' }, 'aria-hidden': 'true' }));
    newParent.appendChild(node);
    if (QG.reducedMotion()) return;
    const last = node.getBoundingClientRect();
    const dx = first.left - last.left, dy = first.top - last.top;
    node.animate(
      [{ transform: 'translate(' + dx + 'px,' + dy + 'px) scale(1.05)' }, { transform: 'none' }],
      { duration: 380, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' }
    );
  }

  function nextRound() {
    const st = state;
    if (!st) return;
    st.r++;
    if (st.r >= st.rounds.length) return end();
    showRound(false);
  }

  function end() {
    const st = state;
    st.watch.stop();
    const secs = st.watch.elapsed;
    const accuracy = st.total / (st.total + st.mistakes);
    const timeBonus = Math.max(0, Math.round((st.total * 8 - secs) * 10));
    const score = Math.max(0, st.total * 100 + timeBonus - st.mistakes * 30);
    const all = st.rounds.flat();
    const missed = all.filter((it) => st.missedIds.has(String(it._id)));
    st.ctx.finish({
      score,
      stars: QG.starsFor(accuracy),
      stats: [
        { label: 'Pairs', value: st.total },
        { label: 'Mistakes', value: st.mistakes },
        { label: 'Time', value: QG.formatTime(secs) },
        { label: 'Accuracy', value: Math.round(accuracy * 100) + '%' },
      ],
      reviewTitle: 'All pairs',
      review: all.map((it) => ({ ok: !st.missedIds.has(String(it._id)), main: T.plain(it, st.s.show), sub: T.plain(it, st.s.target) || it.term })),
      actions: missed.length >= 2 && missed.length < all.length ? [{ label: 'Practise tricky ones (' + missed.length + ')', icon: 'repeat', onClick: () => QG.start({ items: missed }) }] : [],
    });
  }

  function stop() {
    if (!state) return;
    state.watch.stop();
    if (state.dnd) state.dnd.destroy();
    state = null;
  }

  QG.register('match', { start, stop });
})(window.QG);

</script>
</body>
